<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Meet Jev Browser Bridge: one agent, your choice of browser. Watch the 52-second introduction.">
    <meta name="theme-color" content="#FAF9F5">
    <title>Jev Browser Bridge</title>
    <style>
      :root {
        color-scheme: light;
        --cream: #FAF9F5;
        --ink: #141413;
        --coral: #CC785C;
        --line: rgba(20, 20, 19, .16);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--cream);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(1440px, calc(100% - 64px));
        margin: 0 auto;
        padding: clamp(36px, 6vw, 84px) 0 32px;
      }
      header { margin-bottom: clamp(24px, 3.2vw, 44px); }
      .eyebrow {
        margin: 0 0 16px;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      .eyebrow::before { content: "✱"; margin-right: 10px; color: var(--coral); font-size: 18px; }
      h1 {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(38px, 5.1vw, 72px);
        font-weight: 400;
        line-height: 1.12;
        letter-spacing: -.035em;
      }
      .subtitle { margin: 0; font-size: clamp(18px, 2vw, 24px); line-height: 1.5; }
      video {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #181715;
      }
      nav {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 28px;
        margin-top: 16px;
        padding-top: 4px;
      }
      a {
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: var(--coral);
        text-underline-offset: 5px;
        text-decoration-thickness: 1px;
      }
      nav a { display: inline-block; padding: 12px 0; font-size: 14px; line-height: 1.5; }
      a:hover { text-decoration-thickness: 2px; }
      a:focus-visible, video:focus-visible { outline: 3px solid var(--coral); outline-offset: 5px; }
      @media (max-width: 600px) {
        main { width: calc(100% - 32px); padding-top: 30px; }
        .eyebrow { margin-bottom: 14px; font-size: 10px; }
        h1 { max-width: 12ch; }
        video { border-radius: 6px; }
        nav { gap: 2px 22px; margin-top: 10px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Product overview · 52 seconds</p>
        <h1>Jev Browser Bridge</h1>
        <p class="subtitle">One agent. Your choice of browser.</p>
      </header>
      <video controls playsinline preload="metadata" width="1920" height="1080"
        poster="jev-browser-bridge-poster.jpg"
        aria-label="Jev Browser Bridge product introduction">
        <source src="jev-browser-bridge-intro.mp4" type="video/mp4">
        <track kind="captions" src="jev-browser-bridge.en.vtt" srclang="en" label="English">
        Your browser does not support embedded video. <a href="jev-browser-bridge-intro.mp4">Download the video</a>.
      </video>
      <nav aria-label="Video and project resources">
        <a href="https://github.com/lexmount/jev-browser-bridge">GitHub repository</a>
        <a href="https://github.com/lexmount/jev-browser-bridge/blob/main/assets/video/TRANSCRIPT.md">Read transcript</a>
        <a href="jev-browser-bridge-intro.mp4" download>Download MP4</a>
      </nav>
    </main>
  </body>
</html>
