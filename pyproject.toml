[project]
name = "jev-browser-bridge"
version = "0.1.0"
description = "Plug any CDP browser into Jev, including browsers that never draw a page"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx[http2]>=0.28,<1",
  "websockets>=13",
]

[project.optional-dependencies]
lexmount = ["lexmount>=0.5"]

[project.scripts]
jev-browser-bridge = "jev_browser_bridge.cli:main"
# The command's former name, kept for existing scripts.
jev-nolayout = "jev_browser_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_browser_bridge", "jev_nolayout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
