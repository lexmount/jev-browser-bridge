[project]
name = "jev-nolayout"
version = "0.1.0"
description = "A browser agent for Moli that reads structure instead of layout"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx[http2]>=0.28,<1",
  "lexmount>=0.5",
  "websockets>=13",
]

[project.scripts]
jev-nolayout = "jev_nolayout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_nolayout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
